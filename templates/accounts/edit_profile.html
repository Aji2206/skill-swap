{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile | Skill Swap</title>

<link rel="stylesheet" href="{% static 'css/edit_profile.css' %}">

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<h1>✏️ Edit Profile</h1>

<p>
Update your profile information and skills.
</p>

</div>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="form-group">

<label>Profile Picture</label>

{{ form.profile_picture }}

</div>

<div class="form-group">

<label>Bio</label>

{{ form.bio }}

</div>

<div class="form-group">

<label>Location</label>

{{ form.location }}

</div>

<div class="form-group">

<label>Skills Offered</label>

{{ form.skills_offered }}

</div>

<div class="form-group">

<label>Skills Wanted</label>

{{ form.skills_wanted }}

</div>

<div class="buttons">

<button type="submit">

💾 Save Changes

</button>

<a href="{% url 'profile' %}" class="back-btn">

← Back

</a>

</div>

</form>

</div>

</div>

</body>
</html>
