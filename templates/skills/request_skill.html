{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Skill | Skill Swap</title>

    <link rel="stylesheet" href="{% static 'css/request_skill.css' %}">

</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<nav class="navbar">

    <div class="logo">
        🚀 Skill Swap
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'skill_list' %}">Skills</a>
        <a href="{% url 'profile' %}">Profile</a>
    </div>

</nav>

<div class="container">

    <div class="card">

        <div class="icon">
            📩
        </div>

        <h1>Request Skill</h1>

        <p class="subtitle">
            Send a learning request to the skill owner.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="button-group">

                <button type="submit" class="btn-save">
                    📨 Send Request
                </button>

                <a href="{% url 'skill_list' %}" class="btn-cancel">
                    ← Cancel
                </a>

            </div>

        </form>

    </div>

</div>

<footer>

    © 2026 Skill Swap • Learn Together

</footer>

</body>

</html>
